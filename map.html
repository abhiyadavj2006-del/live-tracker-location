<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #000;
            color: aliceblue;
        }

        h4 {
            padding: .5rem;

        }

        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>
    <h4>ID: <span id="display-id"></span></h4>
    <p id="map-notice" hidden>No location has been shared for this ID yet. The map shows a default view and will update live when location data arrives.</p>
    <div id="map"></div>


    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const displayId = document.querySelector("#display-id")
        const id = new URLSearchParams(location.search).get("id")
        // The server renders data as a JSON string, or "null" when this ID has no saved location.
// Never let a missing/unknown ID crash the page: fall back to a default view.
let latLng = [0, 0]
let hasLocation = false
try {
  const parsed = JSON.parse(`{{ data }}`)
  if (Array.isArray(parsed) && parsed.length === 2 && Number.isFinite(Number(parsed[0])) && Number.isFinite(Number(parsed[1]))) {
    latLng = [Number(parsed[0]), Number(parsed[1])]
    hasLocation = true
  }
} catch (error) {
  console.warn("No saved location for this ID yet; showing the default map view.", error)
}
if (!hasLocation) {
  const notice = document.querySelector("#map-notice")
  if (notice) notice.hidden = false
}
        const map = L.map('map').setView(latLng, 12)
        const marker = L.marker(latLng).addTo(map)

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map)

        const socket = io("", {
            secure: true,
            path: "/socket.io",
            transports: ['websocket']
        })

        displayId.textContent = id ?? "(unknown)"
        // on update
        socket.on("map-data", data => {
            if (data.id == id && Number.isFinite(Number(data.lat)) && Number.isFinite(Number(data.lng))) {
                displayId.textContent = `${id ?? "(unknown)"} - updating`
                marker.setLatLng([data.lat, data.lng])
                map.setView([data.lat, data.lng])
    const notice = document.querySelector("#map-notice")
    if (notice) notice.hidden = true

                setTimeout(() => {
                    displayId.textContent = id ?? "(unknown)"
                }, 2500)
            }
        })
    </script>
</body>

</html>
